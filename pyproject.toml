[project]
name = "business-banking-rm-intelligence-hub"
version = "0.1.0"
description = "Reproducible, entirely fictional business banking datasets"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<3", "faker>=37,<38"]

[project.scripts]
banking-data = "banking_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_data", "src/rm_hub", "streamlit_app"]

[dependency-groups]
app = ["duckdb>=1.5,<2", "streamlit>=1.65,<2", "plotly>=6,<7"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
